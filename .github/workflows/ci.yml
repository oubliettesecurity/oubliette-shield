name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest is Ubuntu 26.04, and actions/setup-python has no CPython 3.9
    # build for that image (3.9.25 exists for 22.04 and 24.04 only). Keep 3.9 on
    # ubuntu-24.04 so the declared requires-python floor stays tested.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Real extras only — pyproject has no `ml` extra (was breaking / warning in CI)
          pip install -e ".[dev,flask]"

      - name: Run tests
        run: |
          # Live-server integration tests need :5000/:8000; skip in CI (opt-in via SHIELD_RUN_INTEGRATION_TESTS)
          python -m pytest tests/ -v --tb=short --ignore=tests/test_integration.py

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*
