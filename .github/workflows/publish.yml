# LEGACY (public mirror): PyPI releases for oubliette-shield are owned by the
# private source-of-truth repo oubliettesecurity/oubliette via Trusted Publishing
# (OIDC). This tag-triggered workflow is retained for history / emergency use
# until the public mirror is synced or the workflow is retired. Prefer publishing
# from the private SoT; do not treat this file as the go-forward release path.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # Required for trusted publishing (OIDC)
      attestations: write   # Required for sigstore attestations

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
        # Uses trusted publishing (OIDC) - no API token needed
        # Configure at: https://pypi.org/manage/project/oubliette-shield/settings/publishing/
